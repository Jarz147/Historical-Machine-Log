<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Log - RBAC</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <header>
        <h1>⚙️ Maintenance System</h1>
        <div class="role-selector">
            <span>Mode: </span>
            <select id="roleToggle" onchange="switchRole()">
                <option value="user">User (Pencatatan)</option>
                <option value="admin">Admin (Manage Mesin)</option>
            </select>
        </div>
    </header>
    
    <section id="userSection" class="card">
        <h2>Input Log Maintenance</h2>
        <form id="maintenanceForm">
            <div class="grid-form">
                <div class="form-group">
                    <label>Tanggal</label>
                    <input type="date" id="tanggal" required>
                </div>
                <div class="form-group">
                    <label>Pilih Mesin</label>
                    <select id="select_mesin" required>
                        </select>
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <select id="kategori">
                        <option value="perbaikan">Perbaikan</option>
                        <option value="sparepart">Ganti Sparepart</option>
                        <option value="rutin">Rutin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Teknisi</label>
                    <input type="text" id="teknisi" required>
                </div>
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label>Deskripsi</label>
                <textarea id="deskripsi" rows="3" required></textarea>
            </div>
            <button type="submit" id="btnSimpan" class="btn-primary">Kirim Laporan</button>
        </form>
    </section>

    <section id="adminSection" class="card hidden">
        <h2 style="color: var(--danger);">Admin Panel: Tambah Unit Mesin</h2>
        <form id="addMachineForm" class="grid-form">
            <input type="text" id="new_machine_name" placeholder="Nama Mesin Baru" required>
            <button type="submit" class="btn-admin">Tambah Mesin +</button>
        </form>
    </section>

    <section class="card">
        <h2>Riwayat Maintenance</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Mesin</th>
                        <th>Kategori</th>
                        <th>Deskripsi</th>
                        <th>Teknisi</th>
                    </tr>
                </thead>
                <tbody id="logBody"></tbody>
            </table>
        </div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
