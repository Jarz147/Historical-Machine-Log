<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Mesin - Supabase Cloud</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <header>
        <h1>⚙️ Maintenance Log</h1>
        <p>Sistem Pencatatan Historical Mesin Berbasis Cloud</p>
    </header>
    
    <section class="card">
        <h2>Input Log Baru</h2>
        <form id="maintenanceForm">
            <div class="grid-form">
                <div class="form-group">
                    <label for="tanggal">Tanggal</label>
                    <input type="date" id="tanggal" required>
                </div>
                <div class="form-group">
                    <label for="nama_mesin">Nama/ID Mesin</label>
                    <input type="text" id="nama_mesin" placeholder="Contoh: CNC-01" required>
                </div>
                <div class="form-group">
                    <label for="kategori">Kategori</label>
                    <select id="kategori">
                        <option value="perbaikan">Perbaikan</option>
                        <option value="sparepart">Ganti Sparepart</option>
                        <option value="rutin">Maintenance Rutin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="teknisi">Teknisi</label>
                    <input type="text" id="teknisi" placeholder="Nama Petugas" required>
                </div>
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label for="deskripsi">Deskripsi Detail</label>
                <textarea id="deskripsi" rows="3" placeholder="Detail kerusakan atau part yang diganti..." required></textarea>
            </div>
            <button type="submit" id="btnSimpan" class="btn-primary">Simpan ke Cloud</button>
        </form>
    </section>

    <section class="card">
        <div class="table-header">
            <h2>Riwayat Maintenance</h2>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Mesin</th>
                        <th>Kategori</th>
                        <th>Deskripsi</th>
                        <th>Teknisi</th>
                    </tr>
                </thead>
                <tbody id="logBody">
                    </tbody>
            </table>
        </div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
